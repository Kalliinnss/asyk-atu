<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#2b1d14;color:#f6ecd6;font-family:Georgia,"Times New Roman",serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center}
#hud{width:100%;max-width:480px;display:flex;justify-content:space-between;padding:8px 12px;box-sizing:border-box;font-size:14px}
#hud b{color:#f2b33d}
canvas{display:block;border-radius:10px;box-shadow:0 4px 24px #0008}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#140c06e6;padding:16px;box-sizing:border-box}
#ov .p{max-width:380px;background:#3b2818;border:2px solid #c9922f;border-radius:14px;padding:20px;text-align:left;line-height:1.45;font-size:15px}
#ov h1{margin:0 0 4px;color:#f2b33d;font-size:30px;text-align:center}
#ov h2{margin:0 0 10px;text-align:center;color:#f2b33d}
#ov ul{padding-left:18px;margin:8px 0}
#ov button{display:block;margin:14px auto 0;background:#c9922f;color:#2b1d14;border:0;border-radius:8px;padding:12px 28px;font:bold 17px Georgia,serif;cursor:pointer}
.sub{text-align:center;opacity:.8;font-size:13px}
#hud span{background:#3b2818;border:1px solid #c9922f88;border-radius:20px;padding:3px 10px}
#ov .p{background:linear-gradient(#4a3220,#33200f);box-shadow:0 8px 40px #000a}
#ov input{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border-radius:8px;border:1px solid #c9922f;background:#2b1d14;color:#f6ecd6;font:16px Georgia,serif}
#ov button.alt{background:transparent;color:#f2b33d;border:1px solid #c9922f;margin-top:8px;font-size:15px;padding:9px 22px}

/* ===== Қазақы heritage redesign ===== */
html,body{
  background:
    radial-gradient(circle at 50% -10%, #235b63 0, #173f46 34%, #102b30 62%, #0b1f23 100%);
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;opacity:.16;
  background:
    linear-gradient(45deg,transparent 46%,#e6b85c 47% 53%,transparent 54%) 0 0/34px 34px,
    linear-gradient(-45deg,transparent 46%,#e6b85c 47% 53%,transparent 54%) 17px 17px/34px 34px;
  mask-image:linear-gradient(to bottom,#000 0,#000 12%,transparent 32%,transparent 72%,#000 100%);
}
#app{isolation:isolate}
#hud{
  margin-top:6px;padding:8px 10px;gap:6px;
  border-radius:18px;
}
#hud span{
  flex:1;text-align:center;white-space:nowrap;
  background:linear-gradient(180deg,#173f46ee,#0f2d32ee);
  border:1px solid #d9ad55aa;
  box-shadow:inset 0 1px 0 #fff1,0 5px 16px #0003;
  color:#f7ead0;
}
#hud b{color:#ffd775}
#stage{position:relative;box-sizing:border-box;border:2px solid #d9ad55;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #0008,0 0 0 5px #7d2a20aa,0 0 0 7px #d9ad5544}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;border:0;box-shadow:none;border-radius:0}
#ov{
  overflow:auto;
  background:
    radial-gradient(circle at 50% 10%,#173f46ef,#08191beF 72%),
    linear-gradient(#102b30,#08191b);
}
#ov .p{
  position:relative;
  width:min(92vw,440px);
  max-width:440px;
  background:
    linear-gradient(180deg,#1a4a50f5,#0d2b2ff8);
  border:1px solid #e2ba68;
  border-radius:22px;
  padding:24px 22px 22px;
  box-shadow:0 18px 60px #000a,inset 0 1px 0 #fff2;
  overflow:hidden;
}
#ov .p::before,#ov .p::after{
  content:"";
  position:absolute;left:0;right:0;height:11px;opacity:.95;
  background:
    linear-gradient(135deg,transparent 35%,#e2ba68 36% 48%,transparent 49%) 0 0/26px 11px,
    linear-gradient(45deg,transparent 35%,#9f3428 36% 48%,transparent 49%) 13px 0/26px 11px;
}
#ov .p::before{top:0}
#ov .p::after{bottom:0;transform:rotate(180deg)}
#ov h1{
  font-size:34px;letter-spacing:.6px;color:#ffd775;
  text-shadow:0 2px 0 #6d241b,0 6px 20px #0008;
}
#ov h2{color:#ffd775;text-shadow:0 2px 12px #0008}
#ov button{
  width:100%;max-width:300px;
  border:1px solid #ffd77566;
  background:linear-gradient(180deg,#e4b85d,#c88e32);
  color:#142c2e;
  box-shadow:0 5px 0 #7b4d19,0 10px 24px #0004;
  transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
}
#ov button:hover{filter:brightness(1.06);transform:translateY(-1px)}
#ov button:active{transform:translateY(3px);box-shadow:0 2px 0 #7b4d19,0 5px 14px #0004}
#ov button.alt{
  background:linear-gradient(180deg,#173f46,#12343a);
  color:#ffe0a0;border:1px solid #c89a45;
  box-shadow:0 3px 0 #071b1e,0 8px 18px #0003;
}
#ov input{
  background:#071d20;border:1px solid #c89a45;color:#fff0cf;
  box-shadow:inset 0 2px 8px #0005;
}
.brand-kicker{
  text-align:center;font-size:11px;letter-spacing:2.4px;text-transform:uppercase;
  color:#e2ba68;margin-bottom:3px;
}
.brand-mark{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:4px 0 12px;color:#f8dd9e;font-size:12px;
}
.brand-mark::before,.brand-mark::after{
  content:"";height:1px;width:70px;
  background:linear-gradient(90deg,transparent,#d9ad55);
}
.brand-mark::after{background:linear-gradient(90deg,#d9ad55,transparent)}
.heritage-note{
  margin:12px 0;padding:10px 12px;border-radius:12px;
  background:#071d2077;border:1px solid #d9ad553d;
  font-size:13px;line-height:1.45;color:#eadfc9;
}
.history-scroll{
  max-height:min(58vh,520px);
  overflow-y:auto;
  touch-action:pan-y;
  padding:2px 7px 8px 1px;
  scrollbar-width:thin;
  scrollbar-color:#c89a45 #0d2b2f;
}
.history-scroll h3{margin:15px 0 6px;color:#ffd775;font-size:17px}
.history-scroll p{margin:7px 0;color:#eee2cc;line-height:1.55}
.fact-card{
  margin:10px 0;padding:11px 12px;border-radius:13px;
  background:linear-gradient(135deg,#8f302522,#e4b85d16);
  border:1px solid #e4b85d44;
}
.fact-card b{color:#ffd775}
.timeline{margin:10px 0 2px;padding-left:17px;border-left:2px solid #c99a45}
.timeline div{position:relative;margin:0 0 13px;padding-left:8px;line-height:1.45}
.timeline div::before{
  content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;
  background:#e4b85d;border:2px solid #173f46;box-shadow:0 0 0 2px #e4b85d55;
}
.timeline b{color:#ffd775}
.source-link{
  display:inline-block;margin-top:6px;color:#f3cf82;font-size:12px;
  text-decoration:none;border-bottom:1px dashed #f3cf8277;
}
.source-link:hover{color:#fff0bd}
.section-divider{
  height:1px;margin:14px 0;
  background:linear-gradient(90deg,transparent,#d9ad55,transparent);
}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.menu-grid button{margin:0!important;width:100%;padding:10px 8px!important;font-size:14px!important}
@media(max-width:390px){
  #hud{font-size:11px}
  #hud span{padding:3px 5px}
  #ov .p{padding:22px 16px 18px}
  #ov h1{font-size:30px}
}

<script>
const W=400,H=640,cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),hud=document.getElementById('hud');
cv.width=W;cv.height=H;

const ring=[[200,200]];for(let i=0;i<8;i++)ring.push([200+62*Math.cos(i*Math.PI/4),200+62*Math.sin(i*Math.PI/4)]);
const LV=[
 {n:'Ряд',t:6,p:[[110,200],[155,200],[200,200],[245,200],[290,200]]},
 {n:'Пирамида',t:6,p:[[200,135],[180,170],[220,170],[160,205],[200,205],[240,205]]},
 {n:'Кольцо',t:7,p:ring}];
const TUT={n:'Обучение',t:99,p:[[150,230],[200,230],[250,230]]};
const seen=()=>{try{return localStorage.getItem('asyk_seen')}catch(e){return 1}};
let S={lv:0,score:0,throws:0,asy:[],saka:{x:S0.x,y:S0.y,vx:0,vy:0,r:RS,m:2.2},phase:'menu',tut:false,tn:0,combo:0,msg:'',mt:0},drag=null,best=0;
try{best=+localStorage.getItem('asyk_best')||0}catch(e){}
function say(m){S.msg=m;S.mt=1.4}
function resetSaka(){S.saka={x:S0.x,y:S0.y,vx:0,vy:0,r:RS,m:2.2}}
function loadLevel(){if(S.lv>0)S.tut=false;const L=LV[S.lv];S.throws=L.t+(S.carry||0);S.carry=0;const c=S.throws-L.t;setSaved({lv:S.lv,score:S.score,clears:S.clears,carry:c});S.asy=L.p.map((p,i)=>({x:p[0],y:p[1],vx:0,vy:0,r:RA,m:1,out:false,fade:1,ang:(i*1.7)%3}));resetSaka();S.phase='aim';say('Этап '+(S.lv+1)+': '+L.n+(c?' (+'+c+' бросков)':''))}
function start(tut){if(tut===true)try{localStorage.setItem('asyk_seen',1)}catch(e){}S.carry=0;S.clears=0;S.tut=tut===true;S.tn=0;S.lv=0;S.score=0;ov.style.display='none';loadLevel()}
function menu(){}
function finish(){S.phase='over';let r=S.score>=140?'Шебер — мастер!':S.score>=90?'Мерген — меткий стрелок!':'Бастаушы — новичок';
 const nb=S.score>best;if(nb){best=S.score;try{localStorage.setItem('asyk_best',best)}catch(e){}}setSaved(null);saveResult();
 ov.style.display='flex';ov.innerHTML=`<div class="p"><h2>${S.score>=90?'Победа!':'Раунд завершён'}</h2><div style="text-align:center;font-size:40px;color:#f2b33d">${S.score}</div><div class="sub">очков${nb?' — новый рекорд!':''}</div><p style="text-align:center">Звание: <b>${r}</b><br>Рекорд: ${best}</p><button id="go">Сыграть ещё</button><button id="mn" class="alt">В главное меню</button></div>`;document.getElementById('go').onclick=()=>start(false);document.getElementById('mn').onclick=menu}
function next(){S.lv++;if(S.lv>=LV.length)finish();else loadLevel()}
function endThrow(){S.phase='wait';const c=S.combo;
 if(c>1){const b=5*(c-1);S.score+=b;say('Комбо ×'+c+'! +'+(10*c+b))}else say(c?'+10':'Мимо!');
 const left=S.asy.filter(a=>!a.out).length;
 if(!left){S.clears++;if(S.lv>=LV.length-1){const b=S.throws*10;S.score+=b;setTimeout(()=>say('Поле чисто! бонус +'+b),700)}else{S.carry=S.throws;setTimeout(()=>say(S.throws?'Поле чисто! +'+S.throws+' бросков дальше':'Поле чисто!'),700)}}
 setTimeout(()=>{if(!left||S.throws<=0)next();else{resetSaka();S.phase='aim'}},left?1000:1900)}
function step(dt){
 const all=[S.saka,...S.asy];
 for(const b of all){const d=Math.exp(-(b===S.saka?1.15:2.2)*dt);b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=d;b.vy*=d;if(Math.hypot(b.vx,b.vy)<8)b.vx=b.vy=0;if(b.out)b.fade-=dt*1.5}
 const s=S.saka;
 if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx)*.6}if(s.x>W-s.r){s.x=W-s.r;s.vx=-Math.abs(s.vx)*.6}
 if(s.y<s.r){s.y=s.r;s.vy=Math.abs(s.vy)*.6}if(s.y>H-s.r){s.y=H-s.r;s.vy=-Math.abs(s.vy)*.6}
 if(!s.in&&s.x>F.x+s.r&&s.x<F.x+F.w-s.r&&s.y>F.y+s.r&&s.y<F.y+F.h-s.r)s.in=true;
 if(s.in){const x0=F.x+s.r,x1=F.x+F.w-s.r,y0=F.y+s.r,y1=F.y+F.h-s.r;
  if(s.x<x0){s.x=x0;if(s.vx<0){hit(s.x,s.y,-s.vx);s.vx*=-.82}}if(s.x>x1){s.x=x1;if(s.vx>0){hit(s.x,s.y,s.vx);s.vx*=-.82}}
  if(s.y<y0){s.y=y0;if(s.vy<0){hit(s.x,s.y,-s.vy);s.vy*=-.82}}if(s.y>y1){s.y=y1;if(s.vy>0){hit(s.x,s.y,s.vy);s.vy*=-.82}}}
 const bs=all.filter(b=>!b.out);
 for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){
  const a=bs[i],b=bs[j],dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),m=a.r+b.r;
  if(dd<m&&dd>0){const nx=dx/dd,ny=dy/dd,ov2=m-dd,tm=a.m+b.m;
   a.x-=nx*ov2*b.m/tm;a.y-=ny*ov2*b.m/tm;b.x+=nx*ov2*a.m/tm;b.y+=ny*ov2*a.m/tm;
   const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rv<-120)hit(a.x+nx*a.r,a.y+ny*a.r,-rv);
   if(rv<0){const j2=-1.85*rv/(1/a.m+1/b.m);a.vx-=j2*nx/a.m;a.vy-=j2*ny/a.m;b.vx+=j2*nx/b.m;b.vy+=j2*ny/b.m}}}
 for(const a of S.asy)if(!a.out&&(a.x<F.x||a.x>F.x+F.w||a.y<F.y||a.y>F.y+F.h)){a.out=true;S.score+=10;S.combo++;boom(a.x,a.y)}
}
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{if(S.phase==='aim'){drag=pt(e);cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(drag)drag=pt(e)});
function release(){if(!drag)return;const s=S.saka;let ux,uy,l;
 if(R){const a=aimv();ux=a.ux;uy=a.uy;l=a.l}else{const dx=s.x-drag.x,dy=s.y-drag.y;l=Math.hypot(dx,dy);ux=dx/l;uy=dy/l}
 drag=null;if(l<14)return;const p=Math.min(l,MAXP);s.vx=ux*p*KP;s.vy=uy*p*KP;S.throws--;S.tn++;S.combo=0;S.phase='fly'}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',()=>{drag=null});
function fit(){const a=document.getElementById('app'),ah=a.clientHeight-hud.offsetHeight-8,sc=Math.min(a.clientWidth/W,ah/H);const st=document.getElementById('stage');st.style.width=W*sc+'px';st.style.height=H*sc+'px'}
addEventListener('resize',fit);
let SH=0,AC;function thud(v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;o.type='triangle';o.frequency.setValueAtTime(240+Math.min(v,900)*.2,t);o.frequency.exponentialRampToValueAtTime(60,t+.12);gn.gain.setValueAtTime(Math.min(.4,v/1500),t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(t+.16)}catch(e){}}
function hit(x,y,v){SH=Math.max(SH,Math.min(9,v/110));thud(v);for(let i=0;i<Math.min(10,v/80);i++){const a=Math.random()*6.28,sp=40+Math.random()*120;P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:.7,c:'#fff3c4'})}}
const P=[];function boom(x,y){for(let i=0;i<16;i++){const a=Math.random()*6.28,v=60+Math.random()*150;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:i%2?'#f2b33d':'#fff3c4'})}}
const BG=document.createElement('canvas');BG.width=W;BG.height=H;
(function(){
 const b=BG.getContext('2d');
 let sky=b.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#21545c');sky.addColorStop(.42,'#2d6b73');sky.addColorStop(.421,'#d2ad68');sky.addColorStop(1,'#b5793d');b.fillStyle=sky;b.fillRect(0,0,W,H);
 for(let i=0;i<220;i++){b.fillStyle=`rgba(255,241,210,${Math.random()*.08})`;b.beginPath();b.arc(Math.random()*W,Math.random()*H,Math.random()*1.8+.4,0,7);b.fill()}
 const rugY=20,rugH=18;
 const ornamentBand=(y)=>{for(let x=0;x<W+28;x+=28){b.fillStyle='#f3cb72';b.beginPath();b.moveTo(x+14,y);b.lineTo(x+28,y+9);b.lineTo(x+14,y+18);b.lineTo(x,y+9);b.closePath();b.fill();b.fillStyle='#8a2a1d';b.beginPath();b.moveTo(x+14,y+3);b.lineTo(x+22,y+9);b.lineTo(x+14,y+15);b.lineTo(x+6,y+9);b.closePath();b.fill()}}
 ornamentBand(rugY);ornamentBand(H-34);
 b.fillStyle='#0000002a';b.beginPath();b.roundRect(F.x-18,F.y-10,F.w+36,F.h+34,28);b.fill();
 let wood=b.createLinearGradient(0,F.y-16,0,F.y+F.h+16);wood.addColorStop(0,'#8f5b2c');wood.addColorStop(.5,'#73441e');wood.addColorStop(1,'#5f3416');
 b.fillStyle=wood;b.beginPath();b.roundRect(F.x-14,F.y-16,F.w+28,F.h+32,24);b.fill();
 b.strokeStyle='#f0c56b';b.lineWidth=4;b.stroke();
 b.strokeStyle='#6c1f16';b.lineWidth=10;b.strokeRect(F.x-8,F.y-8,F.w+16,F.h+16);
 let felt=b.createLinearGradient(0,F.y,0,F.y+F.h);felt.addColorStop(0,'#d8b06b');felt.addColorStop(.45,'#c38e47');felt.addColorStop(1,'#a96b2f');
 b.fillStyle=felt;b.fillRect(F.x,F.y,F.w,F.h);
 for(let i=0;i<500;i++){b.fillStyle=`rgba(120,72,28,${Math.random()*.06})`;b.fillRect(F.x+Math.random()*F.w,F.y+Math.random()*F.h,2,2)}
 b.strokeStyle='#f4d27f';b.lineWidth=2;b.strokeRect(F.x,F.y,F.w,F.h);
 b.strokeStyle='#7b2318';b.lineWidth=2.5;b.strokeRect(F.x+6,F.y+6,F.w-12,F.h-12);
 const rosette=(cx,cy,s)=>{b.save();b.translate(cx,cy);for(let i=0;i<4;i++){b.rotate(Math.PI/2);b.fillStyle='#f3d07d';b.beginPath();b.moveTo(0,-s);b.quadraticCurveTo(s*.62,-s*.24,0,s*.12);b.quadraticCurveTo(-s*.62,-s*.24,0,-s);b.fill();b.fillStyle='#8b2a1d';b.beginPath();b.moveTo(0,-s*.58);b.quadraticCurveTo(s*.26,-s*.16,0,0);b.quadraticCurveTo(-s*.26,-s*.16,0,-s*.58);b.fill()}b.restore()}
 rosette(F.x+22,F.y+22,10);rosette(F.x+F.w-22,F.y+22,10);rosette(F.x+22,F.y+F.h-22,10);rosette(F.x+F.w-22,F.y+F.h-22,10);
 b.strokeStyle='#f4dcac33';b.lineWidth=2;for(const r of [110,70,34]){b.beginPath();b.moveTo(200,200-r);b.lineTo(200+r,200);b.lineTo(200,200+r);b.lineTo(200-r,200);b.closePath();b.stroke()}
 b.fillStyle='#6f2018';b.font='bold 13px Georgia';b.textAlign='center';b.fillText('ПОЛЕ: выбей асыки за красную рамку',W/2,F.y-24);
 b.fillStyle='#5a3a1e16';b.fillRect(0,LINE,W,H-LINE);
 b.setLineDash([12,8]);b.strokeStyle='#5a2b1e';b.lineWidth=2.5;b.beginPath();b.moveTo(0,LINE);b.lineTo(W,LINE);b.stroke();b.setLineDash([]);
 b.fillStyle='#5a2b1e';b.font='12px Georgia';b.fillText('Сызық — линия броска',W/2,LINE-8);
 b.fillStyle='rgba(255,240,200,.08)';b.beginPath();b.roundRect(58,LINE+18,W-116,H-LINE-34,18);b.fill();
